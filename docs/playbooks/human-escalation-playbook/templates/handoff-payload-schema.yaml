# Human runtime-payload design worksheet; not a formal OpenEvalGate schema or CLI input.
# Filled IDs, revisions, limits, and values are synthetic teaching examples.
handoff_payload:
  payload_revision: "design-v1"

  workflow:
    workflow_id: ""
    workflow_version: ""
    policy_version: ""
    checkpoint_id: ""
    checkpoint_version: 0
    correlation_id: ""

  user_request:
    user_goal: ""
    unresolved_question: ""
    explicit_human_request: false
    clarification_attempts: 0

  conversation:
    structured_summary: ""
    relevant_turns: []
    full_transcript_reference: ""

  identity_and_auth:
    authenticated: false
    auth_level: ""
    verification_steps_completed: []

  business_context:
    entity_type: ""
    entity_id: ""
    relevant_attributes: {}

  evidence:
    collected_items: []
    missing_items: []
    contradictory_items: []

  actions:
    attempted: []
    completed: []
    failed: []
    proposed_action:
      tool: ""
      parameters: {}
      action_digest: ""
    operation_identity: ""

  policy_checks:
    passed: []
    failed: []
    ambiguous: []

  risk:
    risk_tier: low | medium | high | prohibited
    flags: []
    specialist_route_required: false

  escalation:
    trigger_id: ""
    matched_trigger_ids: []
    execution_blocks: []
    reason: ""
    destination: ""
    sla_minutes: 0
    fallback_destination: ""

  approval:
    review_id: ""
    workflow_id: ""
    action_digest: ""
    checkpoint_version: 0
    policy_version: ""
    authorized_reviewer: ""
    expires_at: ""
    # Populate only for an approval path; never transfer credentials.

  recommendation:
    next_step: ""
    reviewer_decision_required: false

  audit:
    created_at: ""
    created_by: ""
    model_version: ""
    prompt_version: ""
    tool_versions: []

  privacy:
    minimum_sufficient_context_reviewed: false
    unrelated_personal_data_excluded: false
