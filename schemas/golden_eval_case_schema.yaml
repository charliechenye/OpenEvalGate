# HUMAN DOCUMENTATION REFERENCE ONLY. Not a runtime schema or CLI input.
# The former schema_version: 0.1.0 meant a design-reference revision.
artifact_kind: design_reference
reference_revision: "0.1.0"
cli_input: false
current_cli_schema_version: "1"
formal_schema: eval-cases-v1.schema.json
actual_validator: ../openevalgate/schema.py
input_template: ../templates/golden_eval_case.yaml
migration_notes:
  must_do: Move behavioral requirements to expected_behavior.
  must_not_do: Move prohibitions to unacceptable_behavior.
  allowed_and_blocked_tools: Use expected_tool_behavior.allowed_tools and blocked_tools.
  trace_and_state: Use expected_trajectory.required_events/prohibited_events and expected_end_state.assertions.
  handoff: Use expected_handoff with expected_workflow_route approval or escalate; link trigger and destination IDs to the project contract.
  route: Keep response admission in expected_route separate from product workflow in expected_workflow_route.
  scoring: Implement checks in the external harness; retain required human adjudication in a review worksheet.
  release_gate: V1 accepts a string label, not an executable threshold object; use review_policy.yaml for supported core policy and external checks for other rules.
  source_categories_and_contacts: Only non-policy metadata may move to extensions.
